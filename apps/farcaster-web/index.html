<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="theme-color"
      content="#101010"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="application-name" content="Hypercast" />
    <meta name="apple-mobile-web-app-title" content="Hypercast" />
    <meta
      name="description"
      content="Hypercast is an independent social client powered by Hypersnap."
    />
    <meta property="og:site_name" content="Hypercast" />
    <meta property="og:title" content="Hypercast" />
    <meta
      property="og:description"
      content="An independent social client powered by Hypersnap."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="referrer" content="no-referrer" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Hypercast</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Applies the saved theme before first paint. External so the page needs no inline script. -->
    <script src="/theme-init.js"></script>
    <style>
      html.dark {
        background-color: #101010;
        color-scheme: dark;
      }
      html.light {
        background-color: #ffffff;
        color-scheme: light;
      }
      body {
        background-color: inherit;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="modal-root"></div>
    <div id="popover-root"></div>
    <div id="hover-popover-root"></div>
    <script type="module" src="/src/hypercast/main.tsx"></script>
  </body>
</html>
