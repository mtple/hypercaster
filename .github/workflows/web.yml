name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/farcaster-web
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter "farcaster-web..."

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # The default build must be the read-only one.
      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds both variants against a local mock node and drives them in a
      # browser. Nothing here contacts a real network.
      - name: Browser tests
        run: pnpm test:e2e

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/farcaster-web/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14
